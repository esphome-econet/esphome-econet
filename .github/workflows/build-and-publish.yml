---
name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        required: false
        description: "Dry Run: Don't actually deploy to github-pages"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Build all of the firmware variations
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload-artifacts: true

  # Download all firmware variations, consolidate the per-platform manifests (esp32, esp32c3, esp32s3, esp8266)
  # for each unit type into a single manifest, and package *.json and *.bin into a single GitHub Pages artifact.
  consolidate:
    name: Consolidate firmwares
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download built firmwares
        uses: actions/download-artifact@v8
        with:
          path: firmwares
      - name: Dump file list
        run: |-
          ls -R firmwares
      # On a release, github.ref_name is the tag (e.g. v3.8.2). On a manual
      # dispatch it is the branch name, which would publish a manifest claiming
      # to be version "main", so label those builds "dev" instead. Passed via
      # env and --arg rather than interpolated into the jq program, so the ref
      # name is data instead of script.
      - name: Consolidate manifests and binaries
        env:
          VERSION: ${{ github.event_name == 'release' && github.ref_name || 'dev' }}
        run: |-
          shopt -s nullglob
          mkdir output
          for shorthand in etwh hpwh hvac_furnace hvac_air_handler tlwh; do
            manifests=(firmwares/*/econet-"${shorthand}"-*/manifest.json)
            if (( ${#manifests[@]} != 4 )); then
              echo "Expected 4 manifests for ${shorthand}, found ${#manifests[@]}" >&2
              exit 1
            fi
            jq -s --arg version "$VERSION" \
              '{"name": "esphome-econet", "new_install_improv_wait_time": 15, "new_install_prompt_erase": false, "version": $version, "home_assistant_domain": "esphome", "builds": .}' \
              "${manifests[@]}" > "output/econet-${shorthand}.json"
          done
          bins=(firmwares/*/*/*.bin)
          if (( ${#bins[@]} == 0 )); then
            echo "No firmware binaries found in firmwares/*/*/*.bin" >&2
            exit 1
          fi
          cp -R "${bins[@]}" output/
          ls -R output/
      - name: Upload GitHub-Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  # Upload the consolidated package to Github-Pages
  deploy:
    if: ${{ ! inputs.dry_run }}
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: consolidate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
