---
name: Build Firmware

on:
  workflow_call:
    inputs:
      upload-artifacts:
        type: boolean
        required: false
        default: false
        description: "Set to true to have this workflow upload resulting firmware artifacts."
      force-verbose-logging:
        type: boolean
        required: false
        default: false
        description: "Set to true to have this workflow force verbose logging, useful for catching build failures in logging code."
      esphome-version:
        type: string
        required: false
        default: 'latest'
        description: "Specify the esphome release with which to build."
  workflow_dispatch:
    inputs:
      upload-artifacts:
        type: boolean
        required: false
        default: false
        description: "Set to true to have this workflow upload resulting firmware artifacts."
      force-verbose-logging:
        type: boolean
        required: false
        default: false
        description: "Set to true to have this workflow force verbose logging, useful for catching build failures in logging code."
      esphome-version:
        type: string
        required: false
        default: 'latest'
        description: "Specify the esphome release with which to build."

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.esphome-version }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.appliance.shorthand }}-${{ matrix.platform }} Firmware
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [esp32, esp32c3, esp32s3, esp8266]
        appliance:
          - name: electric_tank_water_heater
            shorthand: etwh
          - name: heatpump_water_heater
            shorthand: hpwh
          - name: hvac_furnace
            shorthand: hvac_furnace
          - name: hvac_air_handler
            shorthand: hvac_air_handler
          - name: tankless_water_heater
            shorthand: tlwh
      # Let every appliance/platform combination report on its own. A single
      # transient failure -- e.g. a Docker Hub reset while build-action sets up
      # buildx -- would otherwise cancel the other 19 builds, hiding whether
      # anything is genuinely broken and forcing a full re-run.
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Force Manifest to Build Local Code
        uses: mikefarah/yq@v4
        with:
          cmd: >
            yq -P -i
            '
              .substitutions.external_components_source = "../components" |
              .packages.econet = "../econet_${{ matrix.appliance.name }}.yaml" |
              .packages.econet   tag = "!include"
            '
            build-yaml/econet-${{ matrix.appliance.shorthand }}-${{ matrix.platform }}.yaml
      - name: Add components only for the build
        uses: mikefarah/yq@v4
        with:
          cmd: >
            yq -P -i
            '
              .improv_serial = "" |
              .improv_serial tag = "!!null" |
              .esphome.name_add_mac_suffix = true
            '
            build-yaml/econet-${{ matrix.appliance.shorthand }}-${{ matrix.platform }}.yaml
      - name: Force Verbose Logging
        if: ${{ inputs.force-verbose-logging }}
        uses: mikefarah/yq@v4
        with:
          cmd: >
            yq -P -i
            '
              .substitutions.logger_level = "VERY_VERBOSE"
            '
            build-yaml/econet-${{ matrix.appliance.shorthand }}-${{ matrix.platform }}.yaml
      - name: Build Firmware
        id: esphome-build
        uses: esphome/build-action@v7
        with:
          yaml-file: build-yaml/econet-${{ matrix.appliance.shorthand }}-${{ matrix.platform }}.yaml
          version: ${{ inputs.esphome-version }}
      - name: Copy firmware and manifest
        if: ${{ inputs.upload-artifacts }}
        run: |
          mkdir output
          mv ${{ steps.esphome-build.outputs.name }} output/
      - name: Upload artifact
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: econet-${{ matrix.appliance.shorthand }}-${{ matrix.platform }}
          path: output
          retention-days: 7
  validate-addons:
    name: Validate Add-on Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create add-on test manifests
        env:
          LOGGER_LEVEL: ${{ inputs.force-verbose-logging && 'VERY_VERBOSE' || 'DEBUG' }}
        run: |
          cat <<'EOF' > build-yaml/ci-addons-standalone-bypass.yaml
          ---
          substitutions:
            tx_pin: GPIO19
            rx_pin: GPIO22
            external_components_source: ../components
            zone3name: Bypass3
            zone6name: Bypass6
          esp32:
            board: esp32dev
            variant: esp32
            framework:
              type: esp-idf
          packages:
            econet: !include ../econet_hvac_air_handler.yaml
            bypass3: !include ../hvac-zone-yaml/econet_hvac_zone3_electronicbypass.yaml
            bypass6: !include ../hvac-zone-yaml/econet_hvac_zone6_electronicbypass.yaml
          EOF
          cat <<EOF > build-yaml/ci-addons-full.yaml
          ---
          substitutions:
            tx_pin: GPIO19
            rx_pin: GPIO22
            external_components_source: ../components
            logger_level: ${LOGGER_LEVEL}
            zone1name: Zone1
            zone2name: Zone2
            zone3name: Zone3
            zone4name: Zone4
            zone5name: Zone5
            zone6name: Bypass6
          esp32:
            board: esp32dev
            variant: esp32
            framework:
              type: esp-idf
          packages:
            econet: !include ../econet_hvac_furnace.yaml
            odu: !include ../econet_hvac_odu.yaml
            basic: !include ../econet_hvac_basic_settings.yaml
            time: !include ../econet_time.yaml
            z123: !include ../hvac-zone-yaml/econet_hvac_zone123status.yaml
            z456: !include ../hvac-zone-yaml/econet_hvac_zone456status.yaml
            z1: !include ../hvac-zone-yaml/econet_hvac_zone1.yaml
            z2: !include ../hvac-zone-yaml/econet_hvac_zone2.yaml
            z3: !include ../hvac-zone-yaml/econet_hvac_zone3.yaml
            z4: !include ../hvac-zone-yaml/econet_hvac_zone4.yaml
            z6b: !include ../hvac-zone-yaml/econet_hvac_zone6_electronicbypass.yaml
          EOF
      - name: Validate standalone electronic bypass config
        run: |
          docker run --rm -v "${PWD}:/config" \
            "ghcr.io/esphome/esphome:${{ inputs.esphome-version }}" \
            config build-yaml/ci-addons-standalone-bypass.yaml
      - name: Build full add-ons firmware
        uses: esphome/build-action@v7
        with:
          yaml-file: build-yaml/ci-addons-full.yaml
          version: ${{ inputs.esphome-version }}
  build-status:  # Needed to provide an overall status on this job rather than just the various matrix jobs
    name: Compile Build Status
    needs: [build, validate-addons]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Check build matrix status
        if: ${{ needs.build.result != 'success' || needs.validate-addons.result != 'success' }}
        run: exit 1
