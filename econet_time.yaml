---
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      if:
        condition:
          time.has_time:
        then:
          - logger.log:
              format: "System clock was synced; synchronizing microcontroller to Home Assistant time"
              level: INFO
              tag: homeassistant_time_sync
          - lambda: |-
              const auto now = id(homeassistant_time).now();
              if (!now.is_valid() || now.year < 2024 || now.year > 2099) {
                ESP_LOGW("homeassistant_time_sync", "System clock time is out of range (year=%d)", now.year);
                return;
              }
              id(irtc_year).make_call().set_value(now.year - 2000).perform();
              id(irtc_month).make_call().set_value(now.month).perform();
              id(irtc_day).make_call().set_value(now.day_of_month).perform();
              id(irtc_hour).make_call().set_value(now.hour).perform();
              id(irtc_minute).make_call().set_value(now.minute).perform();
              id(irtc_seconds).make_call().set_value(now.second).perform();
        else:
          - logger.log:
              format: "System clock was synced but time is invalid"
              level: WARN
              tag: homeassistant_time_sync
text_sensor:
  - platform: template
    name: "Microcontroller Datetime"
    id: irtc_time
    icon: mdi:calendar-clock
    update_interval: ${econet_update_interval}
    entity_category: "diagnostic"
    disabled_by_default: true
    lambda: |-
      if (std::isnan(id(irtc_year).state) || std::isnan(id(irtc_month).state) ||
          id(irtc_month).state < 1.0f || id(irtc_month).state > 12.0f ||
          std::isnan(id(irtc_day).state) || id(irtc_day).state < 1.0f || id(irtc_day).state > 31.0f ||
          std::isnan(id(irtc_hour).state) || std::isnan(id(irtc_minute).state) ||
          std::isnan(id(irtc_seconds).state)) {
        // Return undefined if values haven't been successfully fetched yet
        return {};
      }
      tm controller_time{};
      controller_time.tm_sec = static_cast<int>(id(irtc_seconds).state);
      controller_time.tm_min = static_cast<int>(id(irtc_minute).state);
      controller_time.tm_hour = static_cast<int>(id(irtc_hour).state);
      controller_time.tm_mday = static_cast<int>(id(irtc_day).state);
      controller_time.tm_mon = static_cast<int>(id(irtc_month).state) - 1;  // C++: 0-11, econet: 1-12
      controller_time.tm_year = static_cast<int>(id(irtc_year).state) + 2000 - 1900;  // C++: since 1900
      controller_time.tm_isdst = -1;
      std::mktime(&controller_time);
      char time_string[32];
      size_t len = std::strftime(time_string, sizeof(time_string), "%FT%T%z", &controller_time);
      if (len == 0) {
        return {};
      }
      return std::string(time_string, len);
number:
  - platform: econet
    name: "IRTC Year"
    id: irtc_year
    number_datapoint: IRTCYEAR
    unit_of_measurement: "y"
    step: 1
    min_value: 24
    max_value: 99
    mode: box
    entity_category: "config"
    icon: mdi:calendar-clock
    request_mod: 8
    internal: true
