---
globals:
  - id: irtc_initial_sync_done
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: sync_mcu_time
    then:
      - lambda: |-
          const auto now = id(homeassistant_time).now();
          if (!now.is_valid() || now.year < 2024 || now.year > 2099) {
            return;
          }
          if (!id(irtc_year).has_state() || !id(irtc_month).has_state() || !id(irtc_day).has_state() ||
              !id(irtc_hour).has_state() || !id(irtc_minute).has_state() || !id(irtc_seconds).has_state()) {
            // Defer until request_mod 8 has read the MCU clock fields.
            return;
          }
          id(irtc_initial_sync_done) = true;

          const int year = static_cast<int>(std::lround(id(irtc_year).state)) + 2000;
          const int month = static_cast<int>(std::lround(id(irtc_month).state));
          const int day = static_cast<int>(std::lround(id(irtc_day).state));
          const int hour = static_cast<int>(std::lround(id(irtc_hour).state));
          const int minute = static_cast<int>(std::lround(id(irtc_minute).state));
          const int second = static_cast<int>(std::lround(id(irtc_seconds).state));

          bool in_sync = false;
          if (year >= 2019 && year <= 2099 && month >= 1 && month <= 12 && day >= 1 && day <= 31 &&
              hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59 && second >= 0 && second <= 60) {
            esphome::ESPTime mcu_time{};
            mcu_time.year = static_cast<uint16_t>(year);
            mcu_time.month = static_cast<uint8_t>(month);
            mcu_time.day_of_month = static_cast<uint8_t>(day);
            mcu_time.hour = static_cast<uint8_t>(hour);
            mcu_time.minute = static_cast<uint8_t>(minute);
            mcu_time.second = static_cast<uint8_t>(second);
            if (mcu_time.is_valid(false, false)) {
              mcu_time.recalc_timestamp_local();
              if (mcu_time.timestamp >= 0) {
                const long long drift =
                    std::llabs(static_cast<long long>(now.timestamp) - static_cast<long long>(mcu_time.timestamp));
                in_sync = drift <= 30;
              }
            }
          }
          if (in_sync) {
            ESP_LOGD("homeassistant_time_sync", "Microcontroller clock is already within 30s of Home Assistant time");
            return;
          }

          ESP_LOGI("homeassistant_time_sync", "Synchronizing microcontroller clock to Home Assistant time");
          id(irtc_year).make_call().set_value(now.year - 2000).perform();
          id(irtc_month).make_call().set_value(now.month).perform();
          id(irtc_day).make_call().set_value(now.day_of_month).perform();
          id(irtc_hour).make_call().set_value(now.hour).perform();
          id(irtc_minute).make_call().set_value(now.minute).perform();
          id(irtc_seconds).make_call().set_value(now.second).perform();

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      if:
        condition:
          time.has_time:
        then:
          - script.execute: sync_mcu_time
        else:
          - logger.log:
              format: "System clock was synced but time is invalid"
              level: WARN
              tag: homeassistant_time_sync

text_sensor:
  - platform: template
    name: "Microcontroller Datetime"
    id: irtc_time
    icon: mdi:calendar-clock
    update_interval: ${econet_update_interval}
    entity_category: "diagnostic"
    disabled_by_default: true
    lambda: |-
      if (!id(irtc_year).has_state() || !id(irtc_month).has_state() || !id(irtc_day).has_state() ||
          !id(irtc_hour).has_state() || !id(irtc_minute).has_state() || !id(irtc_seconds).has_state()) {
        // Return undefined if values haven't been successfully fetched yet
        return {};
      }
      const int year = static_cast<int>(std::lround(id(irtc_year).state)) + 2000;
      const int month = static_cast<int>(std::lround(id(irtc_month).state));
      const int day = static_cast<int>(std::lround(id(irtc_day).state));
      const int hour = static_cast<int>(std::lround(id(irtc_hour).state));
      const int minute = static_cast<int>(std::lround(id(irtc_minute).state));
      const int second = static_cast<int>(std::lround(id(irtc_seconds).state));
      if (year < 2019 || year > 2099 || month < 1 || month > 12 || day < 1 || day > 31 ||
          hour < 0 || hour > 23 || minute < 0 || minute > 59 || second < 0 || second > 60) {
        return {};
      }
      esphome::ESPTime controller_time{};
      controller_time.year = static_cast<uint16_t>(year);
      controller_time.month = static_cast<uint8_t>(month);
      controller_time.day_of_month = static_cast<uint8_t>(day);
      controller_time.hour = static_cast<uint8_t>(hour);
      controller_time.minute = static_cast<uint8_t>(minute);
      controller_time.second = static_cast<uint8_t>(second);
      if (!controller_time.is_valid(false, false)) {
        return {};
      }
      controller_time.recalc_timestamp_local();
      if (controller_time.timestamp < 0) {
        return {};
      }
      std::string formatted = esphome::ESPTime::from_epoch_local(controller_time.timestamp).strftime("%FT%T%z");
      if (formatted == "ERROR") {
        return {};
      }
      return formatted;

number:
  - platform: econet
    name: "IRTC Year"
    id: irtc_year
    number_datapoint: IRTCYEAR
    step: 1
    min_value: 24
    max_value: 99
    mode: box
    entity_category: "config"
    icon: mdi:calendar-clock
    request_mod: 8
    internal: true
  - platform: econet
    name: "IRTC Month"
    id: irtc_month
    number_datapoint: IRTCMONT
    step: 1
    min_value: 1
    max_value: 12
    mode: box
    entity_category: "config"
    icon: mdi:calendar-clock
    request_mod: 8
    internal: true
  - platform: econet
    name: "IRTC Day"
    id: irtc_day
    number_datapoint: IRTCDAYS
    unit_of_measurement: "d"
    step: 1
    min_value: 1
    max_value: 31
    mode: box
    entity_category: "config"
    icon: mdi:calendar-clock
    request_mod: 8
    internal: true
  - platform: econet
    name: "IRTC Hour"
    id: irtc_hour
    number_datapoint: IRTCHOUR
    unit_of_measurement: "h"
    step: 1
    min_value: 0
    max_value: 23
    mode: box
    entity_category: "config"
    icon: mdi:calendar-clock
    request_mod: 8
    internal: true
  - platform: econet
    name: "IRTC Minute"
    id: irtc_minute
    number_datapoint: IRTCMINS
    unit_of_measurement: "min"
    step: 1
    min_value: 0
    max_value: 59
    mode: box
    entity_category: "config"
    icon: mdi:calendar-clock
    request_mod: 8
    internal: true
  - platform: econet
    name: "IRTC Seconds"
    id: irtc_seconds
    number_datapoint: IRTCSECS
    unit_of_measurement: "s"
    step: 1
    min_value: 0
    max_value: 59
    mode: box
    entity_category: "config"
    icon: mdi:calendar-clock
    request_mod: 8
    internal: true
    on_value:
      if:
        condition:
          lambda: "return !id(irtc_initial_sync_done);"
        then:
          - script.execute: sync_mcu_time
