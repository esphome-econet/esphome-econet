---
globals:
  - id: wh_last_active_preset
    type: std::string
    restore_value: true
    initial_value: '"${water_heater_default_mode_preset}"'

water_heater:
  - platform: template
    id: econet_water_heater
    name: None
    visual:
      min_temperature: "110 °F"
      max_temperature: "140 °F"
      target_temperature_step: "1.0 °F"
    # Every lambda returns {} (don't publish) until the MCU has reported the mode, so the entity
    # reads as unknown rather than reporting the mode the climate is default-initialized to, which
    # is OFF and indistinguishable from the appliance really being off.
    current_temperature: !lambda |-
      if (!id(econet_climate).has_reported_state()) {
        return {};
      }
      return id(econet_climate).current_temperature;
    target_temperature: !lambda |-
      if (!id(econet_climate).has_reported_state()) {
        return {};
      }
      return id(econet_climate).target_temperature;
    is_on: !lambda |-
      if (!id(econet_climate).has_reported_state()) {
        return {};
      }
      if (id(econet_climate).mode == climate::CLIMATE_MODE_OFF) {
        return false;
      }
      if (id(econet_climate).has_custom_preset()) {
        if (id(econet_climate).get_custom_preset() == "${water_heater_off_preset}") {
          return false;
        }
      }
      return true;
    mode: |-
      if (!id(econet_climate).has_reported_state()) {
        return {};
      }
      if (id(econet_climate).mode == climate::CLIMATE_MODE_OFF) {
        return water_heater::WATER_HEATER_MODE_OFF;
      }
      if (id(econet_climate).has_custom_preset()) {
        auto preset = id(econet_climate).get_custom_preset();
        if (preset == "Energy Saver" || preset == "Eco Mode") {
          return water_heater::WATER_HEATER_MODE_ECO;
        }
        if (preset == "Performance") {
          return water_heater::WATER_HEATER_MODE_PERFORMANCE;
        }
        if (preset == "Heat Pump") {
          return water_heater::WATER_HEATER_MODE_HEAT_PUMP;
        }
        if (preset == "High Demand") {
          return water_heater::WATER_HEATER_MODE_HIGH_DEMAND;
        }
        if (preset == "Electric") {
          return water_heater::WATER_HEATER_MODE_ELECTRIC;
        }
        if (preset == "${water_heater_off_preset}") {
          return water_heater::WATER_HEATER_MODE_OFF;
        }
      }
      return ${water_heater_default_mode};
    set_action:
      - lambda: |-
          auto call = id(econet_climate).make_call();
          bool has_climate_change = false;

          const float target_temp = id(econet_water_heater).get_target_temperature();
          if (!std::isnan(target_temp) && target_temp != id(econet_climate).target_temperature) {
            call.set_target_temperature(target_temp);
            has_climate_change = true;
          }

          const bool req_on = id(econet_water_heater).is_on();
          const auto req_mode = id(econet_water_heater).get_mode();
          const auto climate_mode = id(econet_climate).mode;
          const bool preset_is_off =
              id(econet_climate).has_custom_preset() &&
              id(econet_climate).get_custom_preset() == "${water_heater_off_preset}";
          const bool was_off = climate_mode == climate::CLIMATE_MODE_OFF || preset_is_off;

          climate::ClimateMode desired_mode = climate::CLIMATE_MODE_HEAT;
          std::string preset;

          if (!was_off && (!req_on || req_mode == water_heater::WATER_HEATER_MODE_OFF)) {
            // Turn off (via turn_off or selecting OFF mode): save current preset before switching off.
            if (id(econet_climate).has_custom_preset() && !preset_is_off) {
              id(wh_last_active_preset) = id(econet_climate).get_custom_preset().str();
            }
            desired_mode = climate::CLIMATE_MODE_OFF;
            preset = "${water_heater_off_preset}";
          } else if (was_off && !req_on && req_mode == water_heater::WATER_HEATER_MODE_OFF) {
            // Stay off (e.g. changing setpoint or away mode while off).
            desired_mode = climate::CLIMATE_MODE_OFF;
            preset = "${water_heater_off_preset}";
          } else if (was_off && req_on && req_mode == water_heater::WATER_HEATER_MODE_OFF) {
            // Turn on via action: mode_ was synced to OFF while off, so restore the last saved preset.
            desired_mode = climate::CLIMATE_MODE_HEAT;
            preset = id(wh_last_active_preset);
            if (preset.empty() || preset == "${water_heater_off_preset}") {
              preset = "${water_heater_default_mode_preset}";
            }
          } else {
            // Mode change (while on, or selected from UI while off): map mode to preset, save it, and apply.
            desired_mode = climate::CLIMATE_MODE_HEAT;
            if (req_mode == water_heater::WATER_HEATER_MODE_ECO) {
              preset = "${water_heater_eco_preset}";
            } else if (req_mode == water_heater::WATER_HEATER_MODE_PERFORMANCE) {
              preset = "Performance";
            } else if (req_mode == water_heater::WATER_HEATER_MODE_HEAT_PUMP) {
              preset = "Heat Pump";
            } else if (req_mode == water_heater::WATER_HEATER_MODE_HIGH_DEMAND) {
              preset = "High Demand";
            } else if (req_mode == water_heater::WATER_HEATER_MODE_ELECTRIC) {
              preset = "Electric";
            } else if (req_mode == water_heater::WATER_HEATER_MODE_GAS) {
              preset = "${water_heater_default_mode_preset}";
            } else {
              preset = "${water_heater_off_preset}";
            }

            if (preset != "${water_heater_off_preset}") {
              id(wh_last_active_preset) = preset;
            }
          }

          if (desired_mode != climate_mode) {
            call.set_mode(desired_mode);
            has_climate_change = true;
          }
          if (id(econet_climate).get_traits().supports_custom_preset(preset) &&
              (!id(econet_climate).has_custom_preset() || id(econet_climate).get_custom_preset() != preset)) {
            call.set_preset(preset);
            has_climate_change = true;
          }
          if (has_climate_change) {
            call.perform();
          }
      - lambda: |-
          ${water_heater_set_away_code}
