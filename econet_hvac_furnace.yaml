---
substitutions:
  name: "econet-hvac_furnace"
  friendly_name: "Rheem HVAC"
  device_description: "Rheem HVAC"
  furnace_address: "448"
  furnace_kbtus_per_m3: "35.300"  # Natural Gas = approx 35.300, Propane = approx 88.852

packages:
  econet: !include econet_hvac.yaml

econet:
  request_mod_addresses:
    5: ${furnace_address}
    6: ${furnace_address}
  on_datapoint_update:
    - sensor_datapoint: HWSTATUS
      datapoint_type: raw
      src_address: ${furnace_address}
      then:
        - lambda: |-
            if (x.size() <= 138) {
              return;
            }
            // Fields the furnace doesn't populate read back as 0xFFFF -- issue #495 reports
            // static pressure as FFFF on an Endeavor furnace whose STATIC_P datapoint reads
            // correctly. Since these sensors also have their own datapoint, publishing that
            // makes them flip between the real reading and 65535 / 5280 = 12.41 in.
            const uint16_t UNPOPULATED = 0xFFFF;
            // Temperatures are tenths of a degree Fahrenheit decoded as unsigned, so anything
            // above 200.0 is either a sentinel, a disconnected sensor, or a below-zero reading
            // this decoding cannot represent. None of those are worth publishing.
            const uint16_t MAX_TEMPERATURE = 2000;
            const uint16_t cfm = (x[13] << 8) + x[14];
            const uint16_t rpm = (x[17] << 8) + x[18];
            const uint16_t static_p = (x[15] << 8) + x[16];
            const uint16_t return_temp = (x[50] << 8) + x[51];
            const uint16_t outdoor_temp = (x[52] << 8) + x[53];
            if (cfm != UNPOPULATED) {
              id(airhandler_cfm).publish_state(cfm);
            }
            if (rpm != UNPOPULATED) {
              id(airhandler_rpm).publish_state(rpm);
            }
            id(heat_capacity).publish_state(x[11]);
            id(compressor_stage).publish_state(x[12]);
            id(heat_stage).publish_state(x[26]);
            if (static_p != UNPOPULATED) {
              id(static_pressure).publish_state(static_p / 5280.0);
            }
            if (return_temp <= MAX_TEMPERATURE) {
              id(return_air_temperature).publish_state(return_temp / 10.0);
            }
            if (outdoor_temp <= MAX_TEMPERATURE) {
              id(outdoor_air_temperature).publish_state(outdoor_temp / 10.0);
            }
            id(flame_sensor).publish_state(x[33] / 10.0);
            // Accumulators
            id(low_heat_2week_cycles).publish_state((x[102] << 8) + x[103]);
            id(high_heat_2week_cycles).publish_state((x[104] << 8) + x[105]);
            id(blower_2week_cycles).publish_state((x[106] << 8) + x[107]);
            id(powered_2week_cycles).publish_state((x[108] << 8) + x[109]);
            id(low_heat_2week_hrs).publish_state((x[122] << 8) + x[123]);
            id(high_heat_2week_hrs).publish_state((x[124] << 8) + x[125]);
            id(blower_2week_hrs).publish_state((x[126] << 8) + x[127]);
            id(low_heat_lifetime_cycles).publish_state((x[111] << 8) + x[112]);
            id(high_heat_lifetime_cycles).publish_state((x[114] << 8) + x[115]);
            id(blower_lifetime_cycles).publish_state((x[117] << 8) + x[118]);
            id(powered_lifetime_cycles).publish_state((x[120] << 8) + x[121]);
            id(low_heat_lifetime_hrs).publish_state((x[129] << 8) + x[130]);
            id(high_heat_lifetime_hrs).publish_state((x[132] << 8) + x[133]);
            id(blower_lifetime_hrs).publish_state((x[135] << 8) + x[136]);
            id(powered_lifetime_days).publish_state((x[137] << 8) + x[138]);
            if (x.size() <= 146) {
              return;
            }
            const uint16_t supply_temp = (x[145] << 8) + x[146];
            if (supply_temp <= MAX_TEMPERATURE) {
              id(supply_air_temperature).publish_state(supply_temp / 10.0);
            }
    - sensor_datapoint: HRHEEMID
      request_mod: 5
      request_once: true
      src_address: ${furnace_address}
      datapoint_type: raw
      then:
        - lambda: |-
            std::string model;
            std::string serial;
            if (!econet::extract_id_fields(x, &model, &serial)) {
              return;
            }
            id(hw_model_num).publish_state(model);
            id(hw_serial_num).publish_state(serial);
    - sensor_datapoint: HWELL_ID
      request_mod: 6
      request_once: true
      src_address: ${furnace_address}
      datapoint_type: raw
      then:
        - lambda: |-
            std::string sw1;
            std::string sw2;
            if (!econet::extract_id_fields(x, &sw1, &sw2)) {
              return;
            }
            id(furnace_sw).publish_state(sw1);
            id(furnace_sw2).publish_state(sw2);

sensor:
  - platform: econet
    name: "Supply Air Temperature"
    id: supply_air_temperature
    sensor_datapoint: FURNSTMP
    device_class: "temperature"
    unit_of_measurement: "°F"
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    disabled_by_default: true
    request_mod: none
    filters:
      - delta: 0.9
  - platform: econet
    name: "Return Air Temperature"
    id: return_air_temperature
    sensor_datapoint: FURNRTMP
    device_class: "temperature"
    unit_of_measurement: "°F"
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    request_mod: none
    filters:
      - delta: 0.9
  - platform: template
    name: "Outdoor Air Temperature"
    id: outdoor_air_temperature
    device_class: "temperature"
    unit_of_measurement: "°F"
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    disabled_by_default: true
    filters:
      - delta: 0.9
  - platform: template
    name: "Flame Sensor"
    id: flame_sensor
    device_class: "current"
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 4
    unit_of_measurement: "mA"
    filters:
      - delta: 0.09
      - multiply: .001  # Convert from uA to mA
  - platform: econet
    name: "Furnace AFUE"
    id: furnace_afue
    sensor_datapoint: FURNAFUE
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    unit_of_measurement: "%"
    icon: "mdi:fire-circle"
    request_once: true
    filters:
      - lambda: |-  # Some furnaces seem to report waste rather than efficiency; this normalizes things to traditional AFUE
          if (x < 50) return 100-x;
          return x;
  - platform: econet
    name: "Furnace High Heat BTU Output"
    id: furnace_hh_btus
    sensor_datapoint: FURNHBTU
    entity_category: "diagnostic"
    unit_of_measurement: "btu/h"
    icon: "mdi:gas-burner"
    request_once: true
  - platform: econet
    name: "Furnace Low Heat BTU Output"
    id: furnace_lh_btus
    sensor_datapoint: FURNLBTU
    entity_category: "diagnostic"
    unit_of_measurement: "btu/h"
    icon: "mdi:gas-burner"
    request_once: true
  - platform: template
    name: "Two Week Cycles - Low Heat"
    id: low_heat_2week_cycles
    icon: "mdi:sync"
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Two Week Cycles - High Heat"
    id: high_heat_2week_cycles
    icon: "mdi:sync"
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Two Week Cycles - Blower"
    id: blower_2week_cycles
    icon: "mdi:sync"
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Two Week Cycles - Powered"
    id: powered_2week_cycles
    icon: "mdi:sync"
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Two Week Hours - Low Heat"
    unit_of_measurement: "h"
    id: low_heat_2week_hrs
    icon: "mdi:timelapse"
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Two Week Hours - High Heat"
    unit_of_measurement: "h"
    id: high_heat_2week_hrs
    icon: "mdi:timelapse"
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Two Week Hours - Blower"
    unit_of_measurement: "h"
    id: blower_2week_hrs
    icon: "mdi:timelapse"
    state_class: "measurement"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Lifetime Cycles - Low Heat"
    id: low_heat_lifetime_cycles
    icon: "mdi:sync"
    state_class: "total_increasing"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Lifetime Cycles - High Heat"
    id: high_heat_lifetime_cycles
    icon: "mdi:sync"
    state_class: "total_increasing"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Lifetime Cycles - Blower"
    id: blower_lifetime_cycles
    icon: "mdi:sync"
    state_class: "total_increasing"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Lifetime Cycles - Powered"
    id: powered_lifetime_cycles
    icon: "mdi:sync"
    state_class: "total_increasing"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Lifetime Hours - Low Heat"
    unit_of_measurement: "h"
    id: low_heat_lifetime_hrs
    icon: "mdi:timelapse"
    state_class: "total_increasing"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Lifetime Hours - High Heat"
    unit_of_measurement: "h"
    id: high_heat_lifetime_hrs
    icon: "mdi:timelapse"
    state_class: "total_increasing"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Lifetime Hours - Blower"
    unit_of_measurement: "h"
    id: blower_lifetime_hrs
    icon: "mdi:timelapse"
    state_class: "total_increasing"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Lifetime Days - Powered"
    unit_of_measurement: "d"
    id: powered_lifetime_days
    icon: "mdi:timelapse"
    state_class: "total_increasing"
    entity_category: "diagnostic"
    accuracy_decimals: 0
    filters:
      - delta: 0.9
  - platform: template
    name: "Instant BTU Output"
    id: instant_btu_output
    unit_of_measurement: "kbtu/h"
    icon: "mdi:gas-burner"
    state_class: "measurement"
    accuracy_decimals: 3
    filters:
      - delta: 0.9
  - platform: template
    name: "Instant BTU Usage"
    id: instant_btu_usage
    unit_of_measurement: "kbtu/h"
    icon: "mdi:gas-burner"
    state_class: "measurement"
    accuracy_decimals: 3
    filters:
      - delta: 0.9
  - platform: template
    name: "Instant Gas Usage"
    id: gas_usage_m3_h
    unit_of_measurement: "m³/h"
    icon: "mdi:meter-gas"
    state_class: "measurement"
    accuracy_decimals: 3
  - platform: integration
    name: "Total Daily Gas"
    sensor: gas_usage_m3_h
    time_unit: h
    state_class: total_increasing
    device_class: gas
    accuracy_decimals: 5
    unit_of_measurement: "m³"
  - platform: econet
    name: "Indoor KW"
    id: indoor_kw
    sensor_datapoint: INDOORKW
    entity_category: "diagnostic"
    state_class: "total_increasing"
    device_class: energy
    unit_of_measurement: "kWh"
  - platform: template
    name: "Heating Capacity"
    id: heat_capacity
    entity_category: "diagnostic"
    accuracy_decimals: 0
    state_class: "measurement"
    icon: "mdi:gas-burner"
    filters:
      - delta: 0.9
  - platform: template
    name: "Heating Stage"
    id: heat_stage
    entity_category: "diagnostic"
    accuracy_decimals: 0
    state_class: "measurement"
    icon: "mdi:gas-burner"
    filters:
      - delta: 0.9
  - platform: template
    name: "Compressor Stage"
    id: compressor_stage
    entity_category: "diagnostic"
    accuracy_decimals: 0
    state_class: "measurement"
    icon: "mdi:sun-snowflake-variant"
    filters:
      - delta: 0.9

text_sensor:
  - platform: template
    name: "Furnace Model Number"
    id: hw_model_num
    icon: "mdi:information-box"
    entity_category: "diagnostic"
  - platform: template
    name: "Furnace Serial Number"
    id: hw_serial_num
    icon: "mdi:information-box"
    entity_category: "diagnostic"
  - platform: template
    name: "Furnace SW Version"
    id: furnace_sw
    icon: "mdi:information-box"
    entity_category: "diagnostic"
  - platform: template
    name: "Furnace SW Version 2"
    id: furnace_sw2
    icon: "mdi:information-box"
    entity_category: "diagnostic"
    disabled_by_default: true

interval:
  - interval: 5s
    then:
      - lambda: |-
          float furnace_kbtus = id(furnace_hh_btus).state / 1000.0 * id(heat_capacity).state / 100.0;
          float furnace_eff = id(furnace_afue).state / 100.0;
          id(instant_btu_output).publish_state(furnace_kbtus);
          id(instant_btu_usage).publish_state(furnace_kbtus / furnace_eff);
          id(gas_usage_m3_h).publish_state(furnace_kbtus / furnace_eff / ${furnace_kbtus_per_m3});
