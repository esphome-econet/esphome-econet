---
substitutions:
  thermostat_address: "0x380"
  primary_thermostat_address: ${thermostat_address}

# Replace the single-zone climate and global Follow Schedule switch with Zone 1's per-zone entities.
climate:
  - id: !remove econet_climate
  - id: !extend zone1_climate
    # HVACMODE reads "Off" (also when idle), "Fan", "Low Cool", "High Cool", "Low Heat", or
    # "High Heat" on the primary thermostat.
    action_datapoint: HVACMODE
    actions:
      0: "IDLE"
      1: "FAN"
      2: "COOLING"
      3: "COOLING"
      4: "HEATING"
      5: "HEATING"

switch:
  - id: !remove schedule

econet:
  request_mod_addresses:
    10: ${primary_thermostat_address}

packages:
  zone1: !include
    file: econet_hvac_zone_template.yaml
    vars:
      zonename: ${zone1name}
      zonenumber: "1"
      zone_thermostat_requestmod: 0
      primary_thermostat_requestmod: 10
      zone_thermostat_address: ${primary_thermostat_address}
