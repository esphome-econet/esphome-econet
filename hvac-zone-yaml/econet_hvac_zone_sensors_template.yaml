---
substitutions:
  thermostat_address: "0x380"
  primary_thermostat_address: ${thermostat_address}

sensor:
  - platform: econet
    src_address: ${primary_thermostat_address}
    id: zone${zonenumber}_cfm
    name: ${zonename} CFM
    icon: "mdi:fan"
    sensor_datapoint: Z${zonenumber}CFMDSP
    request_mod: ${primary_thermostat_requestmod}
    unit_of_measurement: "ft³/min"
    device_class: "volume_flow_rate"
    accuracy_decimals: 0
    state_class: "measurement"
    entity_category: "diagnostic"
    filters:
      - delta: 9.9
