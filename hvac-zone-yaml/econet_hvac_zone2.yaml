---
substitutions:
  thermostat_address: "0x380"
  primary_thermostat_address: ${thermostat_address}
  zone2_thermostat_address: "0x680"

econet:
  request_mod_addresses:
    10: ${primary_thermostat_address}
    11: ${zone2_thermostat_address}

packages:
  zone2: !include
    file: econet_hvac_zone_template.yaml
    vars:
      zonename: ${zone2name}
      zonenumber: "2"
      zone_thermostat_requestmod: 11
      primary_thermostat_requestmod: 10
      zone_thermostat_address: ${zone2_thermostat_address}
