---
substitutions:
  thermostat_address: "0x380"
  primary_thermostat_address: ${thermostat_address}
  zone4_thermostat_address: "0x682"

econet:
  request_mod_addresses:
    10: ${primary_thermostat_address}
    13: ${zone4_thermostat_address}

packages:
  zone4: !include
    file: econet_hvac_zone_template.yaml
    vars:
      zonename: ${zone4name}
      zonenumber: "4"
      zone_thermostat_requestmod: 13
      primary_thermostat_requestmod: 10
      zone_thermostat_address: ${zone4_thermostat_address}
