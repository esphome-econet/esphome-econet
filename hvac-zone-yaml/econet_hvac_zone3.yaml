---
substitutions:
  thermostat_address: "0x380"
  primary_thermostat_address: ${thermostat_address}
  zone3_thermostat_address: "0x681"

econet:
  request_mod_addresses:
    10: ${primary_thermostat_address}
    12: ${zone3_thermostat_address}

packages:
  zone3: !include
    file: econet_hvac_zone_template.yaml
    vars:
      zonename: ${zone3name}
      zonenumber: "3"
      zone_thermostat_requestmod: 12
      primary_thermostat_requestmod: 10
      zone_thermostat_address: ${zone3_thermostat_address}
